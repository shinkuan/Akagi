name: PR Build Artifacts

on:
  issue_comment:
    types: [created]

# A new request for the same PR replaces an older in-flight build.
concurrency:
  group: pr-build-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.13'
  PBS_RELEASE: '20260414'
  UV_VERSION: '0.11.8'

jobs:
  authorize:
    name: Authorize build request
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/build-artifacts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      head_repository: ${{ steps.authorize.outputs.head_repository }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
    steps:
      - name: Require repository admin permission
        id: authorize
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('authorized', 'false');

            const { owner, repo } = context.repo;
            const username = context.payload.comment.user.login;
            const { data: access } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username,
              });

            if (access.permission !== 'admin') {
              core.notice(`Ignoring build request from non-admin user ${username}`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number,
            });

            if (pull.state !== 'open' || !pull.head.repo) {
              core.notice('Ignoring build request for a closed PR or deleted fork');
              return;
            }

            core.setOutput('authorized', 'true');
            core.setOutput('head_repository', pull.head.repo.full_name);
            core.setOutput('head_sha', pull.head.sha);

  build:
    name: Build (${{ matrix.target }})
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.authorize.outputs.head_repository }}
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prefer ~/.cargo/bin over Homebrew rustup-init (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          save-if: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Setup protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Setup protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.1

      - name: Linux system deps
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            protobuf-compiler

      # PR code must not be able to write into a cache shared with trusted
      # default-branch and release builds.
      - name: Restore bundled runtime cache
        uses: actions/cache/restore@v6
        with:
          path: |
            runtime/python/${{ matrix.target }}
            runtime/uv/${{ matrix.target }}
          key: runtime-${{ matrix.target }}-py${{ env.PYTHON_VERSION }}-pbs${{ env.PBS_RELEASE }}-uv${{ env.UV_VERSION }}

      - name: Fetch python+uv
        shell: bash
        env:
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          PBS_RELEASE: ${{ env.PBS_RELEASE }}
          UV_VERSION: ${{ env.UV_VERSION }}
        run: bash scripts/fetch-runtime.sh "${{ matrix.target }}"

      - name: Build
        shell: bash
        env:
          NO_STRIP: '1'
        run: cargo tauri build --no-bundle --target "${{ matrix.target }}"

      - name: Package zip
        shell: bash
        run: bash scripts/package-zip.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: akagi-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  comment:
    name: Comment artifact links
    needs: [authorize, build]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Post build result
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const artifacts = new Map(
              data.artifacts.map((artifact) => [artifact.name, artifact])
            );
            const expected = [
              ['Linux x86_64', 'akagi-x86_64-unknown-linux-gnu'],
              ['macOS Apple Silicon', 'akagi-aarch64-apple-darwin'],
              ['Windows x86_64', 'akagi-x86_64-pc-windows-msvc'],
            ];
            const lines = expected.map(([label, name]) => {
              const artifact = artifacts.get(name);
              if (!artifact) {
                return `- ${label}: unavailable`;
              }
              const url =
                `${context.serverUrl}/${owner}/${repo}/actions/runs/` +
                `${runId}/artifacts/${artifact.id}`;
              return `- [${label}](${url})`;
            });

            const succeeded =
              process.env.BUILD_RESULT === 'success' &&
              expected.every(([, name]) => artifacts.has(name));
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const heading = succeeded
              ? '✅ PR build completed'
              : `❌ PR build ${process.env.BUILD_RESULT}`;
            const body = [
              heading,
              '',
              `Commit: \`${process.env.HEAD_SHA.slice(0, 12)}\``,
              '',
              ...lines,
              '',
              'Artifacts expire after 14 days.',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body,
            });

            if (process.env.BUILD_RESULT === 'success' && !succeeded) {
              core.setFailed('The build succeeded but one or more artifacts are missing');
            }
