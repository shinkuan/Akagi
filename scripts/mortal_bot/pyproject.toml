# Python environment for the Mortal external bot.
#
# Akagi installs this with `uv sync` into `<bot>/.akagi/venv/`. `libriichi` is
# NOT a pip dependency: it is a native extension built from the Mortal repo and
# placed on disk (see README.md); `bot.py` adds its directory to sys.path.

[project]
name = "akagi-mortal-bot"
version = "0.1.0"
description = "External Mortal (AGPL-3.0) bot for Akagi; loads the Mortal checkout and libriichi at runtime."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "torch>=2.1,<3",
    "numpy>=1.24",
    # Release-style Mortal drops (e.g. shinkuan/Akagi-MjaiBot-Mortal)
    # import `requests` in their model.py for the optional online-fallback
    # client. The git-checkout engine does not need it, but including it
    # keeps both layouts working from the same pyproject.
    "requests>=2.28",
]

# The bot is a directory of scripts, not an installable package.
[tool.uv]
package = false
