[package]
name = "akagi"
version = "3.7.1"
edition = "2021"

[lib]
name = "akagi"

[features]
# Without this, Tauri builds in dev mode and the window loads the Vite
# dev server (`devUrl`) instead of the embedded `frontendDist` — a plain
# `cargo build --release` then shows "localhost refused to connect".
# `cargo tauri build` passes it automatically; plain cargo builds must say
# `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.14"

[dependencies]
# `macos-private-api`: the suggestion overlay is a transparent window, and on
# macOS `WebviewWindowBuilder::transparent` does not exist without this feature
# — it is `#[cfg(any(not(target_os = "macos"), feature = "macos-private-api"))]`.
# Must stay in step with `app.macOSPrivateApi` in tauri.conf.json; the feature
# is what makes the call compile, the config flag is what makes it take effect.
# The catch is that it uses private Apple APIs, so a build with it cannot be
# accepted into the Mac App Store. Akagi ships as an unsigned portable zip from
# GitHub Releases, so that costs us nothing.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Format-preserving TOML for the config save path: `config.toml` can hold keys
# this build doesn't declare (another Akagi's, or the user's own), and
# serialising over the file would delete them. See `src/config/merge.rs`.
toml_edit = "0.25"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "fs", "process", "io-util", "time"] }
async-trait = "0.1.89"
which = "8.0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hudsucker = { version = "0.24", features = ["rcgen-ca", "rustls-client", "http2"], default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12"] }
serde_with = "3.18.0"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
base64 = "0.22"
riichienv-core = "0.4.8"
native_bot = { path = "native_bot" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "charset", "socks"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
# Gzip for `POST /v3/review` bodies: a whole-game mjai log is hundreds of KB
# raw, and the review endpoint prefers (and auto-detects) gzipped uploads.
flate2 = "1"
globset = "0.4"
tempfile = "3"
futures-util = "0.3"
dirs = "6"
chromiumoxide = "0.9.1"
ulid = { version = "1", features = ["serde"] }
rand = "0.9"
http = "1"
http-body-util = "0.1.4"
form_urlencoded = "1.2.2"
# Tenhou `<UN/>` roster names are bare percent-encoded UTF-8 (no `+`-as-space
# form semantics, so `form_urlencoded` would be wrong for them).
percent-encoding = "2.3"
time = "0.3"
self-replace = "1"
semver = "1"
sha1 = "0.11.0"
sha2 = "0.11"
x509-parser = "0.18.1"
thiserror = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
opener = { version = "0.8.5", default-features = false }
rand_distr = "0.5"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "send", "error-send"] }
minisign-verify = "0.2.5"

# Windows-only: find + terminate a surviving controlled Chromium by its command
# line when reopening (Chrome writes no SingletonLock file on Windows, so the
# lock-file reclaim can't see it). Unix reclaims via the SingletonLock symlink,
# so no crate is needed there.
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
# `net` is not in the main tokio feature set; the proxy integration test drives
# the proxy over a real TCP socket.
tokio = { version = "1", features = ["net"] }
# The certificate-report test stands up a real TLS origin, so the proxy's
# upstream verifier has a genuine certificate to observe and record.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
